name: Build Mobile Apps (APK & iOS)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npm run cap:sync:android

      - name: Grant execute permission for gradlew
        working-directory: apps/web/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UntisPlus-Android-Debug-APK
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Archive & IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" -o -name "Xcode_15*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting Xcode at $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npm run cap:sync:ios

      - name: Resolve Swift Package Dependencies
        working-directory: apps/web/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Build iOS Archive (Unsigned)
        working-directory: apps/web/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build/UntisPlus.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Payload to Unsigned IPA
        working-directory: apps/web/ios/App
        run: |
          mkdir -p build/ipa_payload/Payload
          APP_PATH="build/UntisPlus.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/UntisPlus.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          fi
          echo "Packaging App bundle from: $APP_PATH"
          cp -R "$APP_PATH" build/ipa_payload/Payload/
          cd build/ipa_payload
          zip -qry ../UntisPlus-unsigned.ipa Payload
          cd .. && rm -rf ipa_payload
          ls -lh UntisPlus-unsigned.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UntisPlus-iOS-Debug-IPA
          path: apps/web/ios/App/build/UntisPlus-unsigned.ipa
          if-no-files-found: error
